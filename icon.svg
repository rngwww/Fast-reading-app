<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <rect width="180" height="180" fill="#08080A" />
  
  <!-- Crosshair Background -->
  <line x1="90" y1="20" x2="90" y2="160" stroke="#8A8A96" stroke-width="1.5" opacity="0.4" />
  <line x1="20" y1="90" x2="160" y2="90" stroke="#8A8A96" stroke-width="1.5" opacity="0.4" />
  <circle cx="90" cy="90" r="40" fill="none" stroke="#8A8A96" stroke-width="1.5" opacity="0.4" />
  
  <!-- Sharp Helvetica T -->
  <text x="90" y="118" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="-5">T</text>
  
  <!-- Glowing Crimson Focal Dot -->
  <circle cx="90" cy="90" r="6" fill="#FF2A54" filter="drop-shadow(0 0 10px rgba(255,42,84,0.8))" />
</svg>
