<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=430, height=932, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TACHYON Screen 4 - Audio & Settings</title>
  <link rel="stylesheet" href="../assets/css/hybrid.css?v=10">
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    html, body {
      width: 430px;
      height: 932px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #08080A;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
    }

    /* iOS 18/27 Authentic Status Bar */
    .ios-mock-status-bar {
      height: 54px;
      padding: 14px 28px 0 28px;
      display: flex !important;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 100;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .status-time {
      font-weight: 600;
      font-size: 15.5px;
    }

    /* Hardware Dynamic Island centered in status bar */
    .hardware-dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 35px;
      background: #000000;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 11px;
      box-shadow: 0 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    .island-lens {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #080914;
      border: 1px solid #1c1d28;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* iOS Home Bar Indicator at bottom */
    .ios-home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 5px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 3px;
      z-index: 100;
    }

    /* Adjust main app layout to sit cleanly below status bar */
    .modern-app {
      padding-top: 0px !important;
      height: calc(932px - 54px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .top-bar {
      padding: 6px 20px 10px 20px !important;
      margin-top: 0 !important;
    }

    .floating-nav {
      bottom: 26px !important;
    }

    .settings-content-scroll {
      flex: 1;
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .settings-header-row {
      margin-bottom: 2px;
      padding: 0 4px;
    }

    .settings-title-main {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .settings-panel-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 0.5px solid rgba(255, 255, 255, 0.10);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .settings-card-label {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .settings-card-label svg {
      color: #FF2A54;
    }

    /* Sound Chips */
    .sound-chips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .sound-chip-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: rgba(255, 255, 255, 0.7);
    }

    .sound-chip-btn.active {
      background: rgba(255, 42, 84, 0.18);
      border: 1px solid #FF2A54;
      color: #FFFFFF;
      box-shadow: 0 0 16px rgba(255, 42, 84, 0.35);
    }

    .sound-chip-name {
      font-size: 13px;
      font-weight: 600;
    }

    .sound-eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 12px;
    }

    .sound-eq-bar {
      width: 2.5px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 1.5px;
    }

    .sound-chip-btn.active .sound-eq-bar {
      background: #FF2A54;
    }

    /* Switch row */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 0.5px solid rgba(255, 255, 255, 0.08);
    }

    .toggle-info strong {
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      display: block;
    }

    .toggle-info span {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.5);
    }

    .ios-switch-pill {
      width: 48px;
      height: 28px;
      background: #34C759;
      border-radius: 14px;
      position: relative;
      box-shadow: 0 0 12px rgba(52, 199, 89, 0.4);
    }

    .ios-switch-thumb {
      width: 24px;
      height: 24px;
      background: #FFFFFF;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      right: 2px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* Color Swatches */
    .color-swatches-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .swatch-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .swatch-dot.active::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid #FFFFFF;
    }

    /* Theme picker cards */
    .themes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .theme-card-preview {
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .theme-card-preview.active {
      border-color: #FF2A54;
      background: rgba(255, 42, 84, 0.1);
      box-shadow: 0 0 14px rgba(255, 42, 84, 0.25);
    }

    .theme-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body data-theme="obsidian">

  <!-- Ambient Blurry Wallpaper Backdrop -->
  <div class="wallpaper-backdrop">
    <div class="wallpaper-layer wallpaper-obsidian" style="opacity: 1;"></div>
  </div>

  <!-- Atmospheric Ambient Liquid Glow -->
  <div class="ambient-glow">
    <div class="ambient-circle-1"></div>
    <div class="ambient-circle-2"></div>
  </div>

  <!-- iOS Status Bar -->
  <div class="ios-mock-status-bar">
    <span class="status-time">9:41</span>
    <div class="hardware-dynamic-island">
      <div class="island-lens"></div>
    </div>
    <div class="status-icons">
      <!-- Signal -->
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
        <rect x="0" y="8" width="3" height="4" rx="1"/>
        <rect x="4.5" y="5.5" width="3" height="6.5" rx="1"/>
        <rect x="9" y="3" width="3" height="9" rx="1"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1"/>
      </svg>
      <!-- Wi-Fi -->
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
        <path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
        <path d="M4.5 7.5a5 5 0 0 1 7 0 .8.8 0 0 0 1.1-1.1 6.6 6.6 0 0 0-9.2 0 .8.8 0 0 0 1.1 1.1z"/>
        <path d="M1.5 4.5a9.2 9.2 0 0 1 13 0 .8.8 0 0 0 1.1-1.1 10.8 10.8 0 0 0-15.2 0 .8.8 0 0 0 1.1 1.1z"/>
      </svg>
      <!-- Battery -->
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.5"/>
        <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/>
        <path d="M23 4.5v3c.8 0 1.5-.7 1.5-1.5s-.7-1.5-1.5-1.5z" fill="currentColor" fill-opacity="0.5"/>
      </svg>
    </div>
  </div>

  <main class="modern-app">
    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="brand-lockup">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <div class="brand-title">TACHYON</div>
      </div>

      <div class="top-bar-actions">
        <!-- Streak Widget Pill Button -->
        <button class="streak-pill-btn">
          <div class="streak-flame-wrapper">
            <svg class="cartoon-flame" viewBox="0 0 32 36" fill="none">
              <path class="flame-outer" d="M16 2C16 2 22 8 22 15C22 17.5 21 19.5 19.5 21C21.5 19 22.5 16 22 13C24.5 15.5 27 19.5 27 24C27 30 22 34 16 34C10 34 5 30 5 24C5 18 9 12 13 8C13 12 15 14 16 14C16 11 16 2 16 2Z" fill="url(#flameGradOuter)"/>
              <path class="flame-middle" d="M16 12C16 12 20 16 20 21C20 23 19 24.5 18 25.5C19 24 19.5 22 19 20C20.5 21.5 22 23.5 22 26C22 29.5 19 32 16 32C13 32 10 29.5 10 26C10 21.5 13 18 15 15C15 17 16 18 16 18C16 16 16 12 16 12Z" fill="url(#flameGradMiddle)"/>
              <path class="flame-core" d="M16 20C16 20 18 23 18 26C18 28 17 29.5 16 30C15 29.5 14 28 14 26C14 23 16 20 16 20Z" fill="#FFFBE6"/>
              <defs>
                <linearGradient id="flameGradOuter" x1="16" y1="2" x2="16" y2="34" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FF3B30"/>
                  <stop offset="0.6" stop-color="#FF9500"/>
                  <stop offset="1" stop-color="#FFCC00"/>
                </linearGradient>
                <linearGradient id="flameGradMiddle" x1="16" y1="12" x2="16" y2="32" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FF9500"/>
                  <stop offset="1" stop-color="#FFD60A"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="streak-count-txt">14</span>
          <span class="streak-unit-txt">DAYS</span>
        </button>
      </div>
    </header>

    <!-- TAB 4: SETTINGS CONTENT -->
    <div class="settings-content-scroll">
      <!-- Title -->
      <div class="settings-header-row">
        <h2 class="settings-title-main">Settings</h2>
      </div>

      <!-- Card 1: Synthetic Sound Profiles -->
      <div class="settings-panel-card">
        <div class="settings-card-label">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <span>Synthetic Audio Metronome</span>
        </div>

        <div class="sound-chips-grid">
          <div class="sound-chip-btn">
            <span class="sound-chip-name">Haptic</span>
            <div class="sound-eq-bars">
              <span class="sound-eq-bar" style="height: 5px;"></span>
              <span class="sound-eq-bar" style="height: 8px;"></span>
              <span class="sound-eq-bar" style="height: 4px;"></span>
            </div>
          </div>

          <div class="sound-chip-btn">
            <span class="sound-chip-name">Ceramic</span>
            <div class="sound-eq-bars">
              <span class="sound-eq-bar" style="height: 6px;"></span>
              <span class="sound-eq-bar" style="height: 10px;"></span>
              <span class="sound-eq-bar" style="height: 7px;"></span>
            </div>
          </div>

          <div class="sound-chip-btn active">
            <span class="sound-chip-name" style="color: #FF2A54;">Mechanical</span>
            <div class="sound-eq-bars">
              <span class="sound-eq-bar" style="height: 10px;"></span>
              <span class="sound-eq-bar" style="height: 12px;"></span>
              <span class="sound-eq-bar" style="height: 8px;"></span>
            </div>
          </div>

          <div class="sound-chip-btn">
            <span class="sound-chip-name">Wood</span>
            <div class="sound-eq-bars">
              <span class="sound-eq-bar" style="height: 4px;"></span>
              <span class="sound-eq-bar" style="height: 7px;"></span>
              <span class="sound-eq-bar" style="height: 5px;"></span>
            </div>
          </div>

          <div class="sound-chip-btn">
            <span class="sound-chip-name">Pulse</span>
            <div class="sound-eq-bars">
              <span class="sound-eq-bar" style="height: 8px;"></span>
              <span class="sound-eq-bar" style="height: 11px;"></span>
              <span class="sound-eq-bar" style="height: 9px;"></span>
            </div>
          </div>

          <div class="sound-chip-btn">
            <span class="sound-chip-name">Vinyl</span>
            <div class="sound-eq-bars">
              <span class="sound-eq-bar" style="height: 6px;"></span>
              <span class="sound-eq-bar" style="height: 9px;"></span>
              <span class="sound-eq-bar" style="height: 6px;"></span>
            </div>
          </div>
        </div>

        <div class="toggle-row">
          <div class="toggle-info">
            <strong>Subvocalization Lock</strong>
            <span>Audio tick per word prevents inner voice</span>
          </div>
          <div class="ios-switch-pill">
            <div class="ios-switch-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Card 2: Focal Reticle Accent -->
      <div class="settings-panel-card">
        <div class="settings-card-label">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
          <span>Focal Reticle Accent Color</span>
        </div>

        <div class="color-swatches-row">
          <div class="swatch-dot active" style="background: #FF2A54;"></div>
          <div class="swatch-dot" style="background: #FF9500;"></div>
          <div class="swatch-dot" style="background: #FFCC00;"></div>
          <div class="swatch-dot" style="background: #34C759;"></div>
          <div class="swatch-dot" style="background: #00C7BE;"></div>
          <div class="swatch-dot" style="background: #007AFF;"></div>
          <div class="swatch-dot" style="background: #AF52DE;"></div>
          <div class="swatch-dot" style="background: #FFFFFF;"></div>
        </div>
      </div>

      <!-- Card 3: Cinematic Themes -->
      <div class="settings-panel-card">
        <div class="settings-card-label">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          <span>Cinematic Theme</span>
        </div>

        <div class="themes-grid">
          <div class="theme-card-preview active">
            <div class="theme-circle" style="background: #000000;"></div>
            <div style="font-size: 13px; font-weight: 600; color: #FFFFFF;">Obsidian</div>
          </div>
          <div class="theme-card-preview">
            <div class="theme-circle" style="background: #F2F2F7;"></div>
            <div style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7);">Daylight</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Liquid Navigation Pill (Settings Active) -->
    <nav class="floating-nav">
      <div class="nav-pill-container">
        <button class="nav-tab-btn">
          <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
          <span>Reader</span>
        </button>
        <button class="nav-tab-btn">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>Library</span>
        </button>
        <button class="nav-tab-btn">
          <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>Prime</span>
        </button>
        <button class="nav-tab-btn active" style="color: #FFFFFF;">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>Settings</span>
        </button>
      </div>
    </nav>

    <!-- iOS Home Indicator -->
    <div class="ios-home-indicator"></div>
  </main>
</body>
</html>
