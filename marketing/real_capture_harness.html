<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px;
    height: 1000px;
    background: transparent;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  #phone-frame {
    width: 430px;
    height: 932px;
    border: none;
    overflow: hidden;
    background: #000000;
  }
</style>
</head>
<body>
  <iframe id="phone-frame"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const screen = params.get('screen') || 'reader';
    const theme = params.get('theme') || 'obsidian';
    const wpm = params.get('wpm') || '700';

    try {
      localStorage.setItem('tachyon_settings', JSON.stringify({
        wpm: parseInt(wpm) || 500,
        masterVolume: 0.3,
        isMuted: false,
        isPro: true,
        soundProfile: 'mechanical',
        colorPalette: 'red',
        activeDocId: null,
        rsvpFont: 'sans',
        fontSize: 'md',
        warmUpMode: false,
        uiSoundsEnabled: true,
        appTheme: theme,
        language: 'en'
      }));
    } catch(e) {}

    const iframe = document.getElementById('phone-frame');
    iframe.src = '/index.html';
    iframe.onload = () => {
      setTimeout(() => {
        const idoc = iframe.contentDocument || iframe.contentWindow.document;
        const iwin = iframe.contentWindow;

        // Apply theme
        idoc.body.setAttribute('data-theme', theme);
        const wpObs = idoc.querySelector('.wallpaper-obsidian');
        const wpVel = idoc.querySelector('.wallpaper-vellum');
        if (theme === 'vellum') {
          iframe.style.background = '#F2F2F7';
          if (wpObs) wpObs.style.opacity = '0';
          if (wpVel) wpVel.style.opacity = '1';
        } else {
          iframe.style.background = '#000000';
          if (wpObs) wpObs.style.opacity = '1';
          if (wpVel) wpVel.style.opacity = '0';
        }

        // Helper to update nav tab pill
        function setActiveTab(targetId) {
          const navBtns = idoc.querySelectorAll('.nav-tab-btn');
          const tabPanels = idoc.querySelectorAll('.tab-panel');
          const navSlidingPill = idoc.getElementById('navSlidingPill');

          let activeBtn = null;
          navBtns.forEach(btn => {
            const isTarget = btn.dataset.target === targetId;
            btn.classList.toggle('active', isTarget);
            if (isTarget) activeBtn = btn;
          });

          tabPanels.forEach(panel => {
            panel.classList.toggle('active', panel.id === targetId);
          });

          if (activeBtn && navSlidingPill) {
            const container = activeBtn.parentElement;
            const cRect = container.getBoundingClientRect();
            const bRect = activeBtn.getBoundingClientRect();
            navSlidingPill.style.width = `${bRect.width}px`;
            navSlidingPill.style.height = `${bRect.height}px`;
            navSlidingPill.style.transform = `translateX(${bRect.left - cRect.left}px)`;
          }
        }

        if (screen === 'reader') {
          setActiveTab('tabReader');

          // Speed
          const badgeVal = idoc.getElementById('speedBadgeVal');
          if (badgeVal) badgeVal.textContent = wpm;

          idoc.querySelectorAll('.speed-preset-btn').forEach(btn => {
            if (btn.dataset.wpm === wpm) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });

          // Active Word
          const wPre = idoc.getElementById('wordPre');
          const wFocal = idoc.getElementById('wordFocal');
          const wPost = idoc.getElementById('wordPost');
          if (wPre && wFocal && wPost) {
            wPre.textContent = 'VELO';
            wFocal.textContent = 'C';
            wPost.textContent = 'ITY';
          }

          // Active book badge
          const bookBadge = idoc.getElementById('stageBookBadge');
          const bookTitle = idoc.getElementById('stageBookTitle');
          if (bookBadge && bookTitle) {
            bookTitle.textContent = 'Meditations • Marcus Aurelius';
            bookBadge.style.display = 'inline-flex';
          }

          // Scrubber
          const sPos = idoc.getElementById('scrubberWordPos');
          const sTot = idoc.getElementById('scrubberWordTotal');
          const sPct = idoc.getElementById('scrubberPct');
          const sSlider = idoc.getElementById('progressScrubber');
          if (sPos) sPos.textContent = '1,420';
          if (sTot) sTot.textContent = '3,200';
          if (sPct) sPct.textContent = '44%';
          if (sSlider) sSlider.value = 44;

        } else if (screen === 'library') {
          setActiveTab('tabLibrary');

          // Render authentic book cards in libraryGrid
          const libraryGrid = idoc.getElementById('libraryGrid');
          if (libraryGrid) {
            libraryGrid.innerHTML = `
              <div class="book-card-item">
                <div class="book-card" style="--card-color: var(--palette-blue); border-left: 4px solid var(--palette-blue);">
                  <div class="book-info">
                    <div class="book-title-row">
                      <span class="book-title">Relativity (Excerpt)</span>
                    </div>
                    <div class="book-meta">
                      <span>Albert Einstein</span>
                      <span>•</span>
                      <span>345 words</span>
                      <span>•</span>
                      <span style="color: var(--text-primary); font-weight: 700;">78%</span>
                    </div>
                  </div>
                  <div class="book-actions-group">
                    <div class="book-ring-wrap" title="78% read">
                      <svg viewBox="0 0 40 40">
                        <circle class="book-ring-bg" cx="20" cy="20" r="16"></circle>
                        <circle class="book-ring-prog" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="22.1"></circle>
                      </svg>
                      <span class="book-ring-val">78%</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="book-card-item">
                <div class="book-card" style="--card-color: var(--palette-green); border-left: 4px solid var(--palette-green);">
                  <div class="book-info">
                    <div class="book-title-row">
                      <span class="book-title">A Scandal in Bohemia</span>
                    </div>
                    <div class="book-meta">
                      <span>Arthur Conan Doyle</span>
                      <span>•</span>
                      <span>426 words</span>
                      <span>•</span>
                      <span style="color: var(--text-primary); font-weight: 700;">45%</span>
                    </div>
                  </div>
                  <div class="book-actions-group">
                    <div class="book-ring-wrap" title="45% read">
                      <svg viewBox="0 0 40 40">
                        <circle class="book-ring-bg" cx="20" cy="20" r="16"></circle>
                        <circle class="book-ring-prog" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="55.2"></circle>
                      </svg>
                      <span class="book-ring-val">45%</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="book-card-item">
                <div class="book-card" style="--card-color: var(--palette-orange); border-left: 4px solid var(--palette-orange);">
                  <div class="book-info">
                    <div class="book-title-row">
                      <span class="book-title">Meditations (Excerpt)</span>
                      <span class="book-recall-pill master" title="Latest Retention: Total Recall (100%)">
                        <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <span>100%</span>
                      </span>
                    </div>
                    <div class="book-meta">
                      <span>Marcus Aurelius</span>
                      <span>•</span>
                      <span>332 words</span>
                      <span>•</span>
                      <span style="color: var(--text-primary); font-weight: 700;">100%</span>
                    </div>
                  </div>
                  <div class="book-actions-group">
                    <div class="book-ring-wrap" title="100% read">
                      <svg viewBox="0 0 40 40">
                        <circle class="book-ring-bg" cx="20" cy="20" r="16"></circle>
                        <circle class="book-ring-prog" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="0"></circle>
                      </svg>
                      <span class="book-ring-val">100%</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="book-card-item">
                <div class="book-card" style="--card-color: var(--palette-purple); border-left: 4px solid var(--palette-purple);">
                  <div class="book-info">
                    <div class="book-title-row">
                      <span class="book-title">The Time Machine</span>
                    </div>
                    <div class="book-meta">
                      <span>H.G. Wells</span>
                      <span>•</span>
                      <span>512 words</span>
                      <span>•</span>
                      <span style="color: var(--text-primary); font-weight: 700;">18%</span>
                    </div>
                  </div>
                  <div class="book-actions-group">
                    <div class="book-ring-wrap" title="18% read">
                      <svg viewBox="0 0 40 40">
                        <circle class="book-ring-bg" cx="20" cy="20" r="16"></circle>
                        <circle class="book-ring-prog" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="82.4"></circle>
                      </svg>
                      <span class="book-ring-val">18%</span>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }

        } else if (screen === 'settings') {
          setActiveTab('tabSettings');

          // Activate Mechanical sound profile
          idoc.querySelectorAll('.sound-chip').forEach(c => {
            c.classList.toggle('active', c.dataset.profile === 'mechanical');
            c.classList.remove('locked');
          });

          // Activate Crimson focal dot
          idoc.querySelectorAll('.accent-dot').forEach(d => {
            d.classList.toggle('active', d.dataset.color === 'red');
            d.classList.remove('locked');
          });

        } else if (screen === 'themes_dark') {
          setActiveTab('tabReader');

          const p500D = idoc.querySelector('.speed-preset-btn[data-wpm="500"]');
          if (p500D) p500D.click();

          const wPre = idoc.getElementById('wordPre');
          const wFocal = idoc.getElementById('wordFocal');
          const wPost = idoc.getElementById('wordPost');
          if (wPre && wFocal && wPost) {
            wPre.textContent = 'SYN';
            wFocal.textContent = 'A';
            wPost.textContent = 'PSE';
          }

          const bookBadge = idoc.getElementById('stageBookBadge');
          const bookTitle = idoc.getElementById('stageBookTitle');
          if (bookBadge && bookTitle) {
            bookTitle.textContent = 'Neuromancer • William Gibson';
            bookBadge.style.display = 'inline-flex';
          }

          const sPos = idoc.getElementById('scrubberWordPos');
          const sTot = idoc.getElementById('scrubberWordTotal');
          const sPct = idoc.getElementById('scrubberPct');
          const sSlider = idoc.getElementById('progressScrubber');
          if (sPos) sPos.textContent = '840';
          if (sTot) sTot.textContent = '2,400';
          if (sPct) sPct.textContent = '35%';
          if (sSlider) sSlider.value = 35;

        } else if (screen === 'themes_light') {
          setActiveTab('tabReader');

          const p500L = idoc.querySelector('.speed-preset-btn[data-wpm="500"]');
          if (p500L) p500L.click();

          const wPre = idoc.getElementById('wordPre');
          const wFocal = idoc.getElementById('wordFocal');
          const wPost = idoc.getElementById('wordPost');
          if (wPre && wFocal && wPost) {
            wPre.textContent = 'LU';
            wFocal.textContent = 'M';
            wPost.textContent = 'EN';
          }

          const bookBadge = idoc.getElementById('stageBookBadge');
          const bookTitle = idoc.getElementById('stageBookTitle');
          if (bookBadge && bookTitle) {
            bookTitle.textContent = 'Walden • Henry David Thoreau';
            bookBadge.style.display = 'inline-flex';
          }

          const sPos = idoc.getElementById('scrubberWordPos');
          const sTot = idoc.getElementById('scrubberWordTotal');
          const sPct = idoc.getElementById('scrubberPct');
          const sSlider = idoc.getElementById('progressScrubber');
          if (sPos) sPos.textContent = '1,680';
          if (sTot) sTot.textContent = '2,400';
          if (sPct) sPct.textContent = '70%';
          if (sSlider) sSlider.value = 70;
        }

        window.rendered = true;
      }, 1000);
    };
  </script>
</body>
</html>
