<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>TACHYON | RSVP Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wave-bg"></div>
  <main class="app-container">
    <header>
      <h1>TACHYON</h1>
      <p class="tagline">Read faster than thought.</p>
    </header>

    <nav class="xmb-nav">
      <div class="nav-track">
        <button class="nav-tab active" data-target="tab-reader">Reader</button>
        <button class="nav-tab" data-target="tab-library">Library</button>
        <button class="nav-tab" data-target="tab-settings">Settings</button>
        <button class="nav-tab" data-target="tab-guide">Guide</button>
        <div class="nav-indicator" id="navIndicator"></div>
      </div>
    </nav>
    
    <div class="tab-content active" id="tab-reader">

    <div class="reader-card" id="readerCard">
      <!-- Pause HUD -->
      <div id="pauseHud" class="hud-overlay hidden">
        <div class="hud-content">
          <h2 style="letter-spacing: 2px;">PAUSED</h2>
          <div class="hud-stats">
            <span>Word: <span id="hudWordPos">0</span> / <span id="hudWordTotal">0</span></span>
            <span>Speed: <span id="hudWpm">350</span> WPM</span>
            <span>Progress: <span id="hudProgress">0</span>%</span>
          </div>
          <div class="hud-controls">
            <button id="jumpBackBtn" class="btn secondary">-5 Words</button>
            <button id="resumeBtn" class="btn primary">Resume</button>
          </div>
        </div>
      </div>

      <!-- Countdown HUD -->
      <div id="countdownHud" class="hud-overlay hidden">
        <div class="countdown-ring">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="45"></circle>
            <circle id="ringProgress" class="ring-progress" cx="50" cy="50" r="45"></circle>
          </svg>
          <span id="countdownText">3</span>
        </div>
      </div>

      <div class="rsvp-display" id="rsvpDisplay">
        <span class="word-start" id="wordStart"></span><span class="focal-point" id="focalPoint"></span><span class="word-end" id="wordEnd"></span>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="controls-card">
      <div class="wpm-control">
        <label for="wpmSlider">WPM: <span id="wpmValue">350</span></label>
        <input type="range" id="wpmSlider" min="100" max="1200" step="10" value="350">
      </div>
      <div class="audio-control">
        <button id="muteBtn" class="btn secondary icon-btn" aria-label="Toggle Audio">🔊</button>
        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.3">
      </div>
      <div class="buttons">
        <button id="resetBtn" class="btn secondary">Reset</button>
        <button id="playPauseBtn" class="btn primary">Play</button>
      </div>
    </div>

    <div class="input-card">
      <textarea id="textInput" placeholder="Paste your text here..."></textarea>
    </div>
    
    <div class="tab-content" id="tab-library">
      <div class="reader-card">
        <h3>Library</h3>
        <p style="color: var(--text-secondary); text-align: center; margin-top: 10px; font-size: 14px;">Your saved texts will appear here.</p>
      </div>
    </div>
    
    <div class="tab-content" id="tab-settings">
      <div class="reader-card">
        <h3>Settings</h3>
        <p style="color: var(--text-secondary); text-align: center; margin-top: 10px; font-size: 14px;">Theme and advanced reading config.</p>
      </div>
    </div>
    
    <div class="tab-content" id="tab-guide">
      <div class="reader-card">
        <h3>How It Works</h3>
        <p style="color: var(--text-secondary); text-align: center; margin-top: 10px; font-size: 14px; line-height: 1.5;">Focus on the crimson dot.<br>Do not move your eyes.<br>Let the words flow through you.</p>
      </div>
    </div>

  </main>
  <script src="app.js"></script>
</body>
</html>
